<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo Internet Banking</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        body {
            background-color: #f0f2f5;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px 0;
        }

        .hidden {
            display: none !important;
        }

        /* --- MÀN HÌNH XÁC THỰC (ĐĂNG NHẬP / ĐĂNG KÝ) --- */
        .auth-card {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .auth-card h2 {
            color: #1b4998;
            margin-bottom: 8px;
        }

        .auth-card p {
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .auth-tabs {
            display: flex;
            margin-bottom: 20px;
            border-bottom: 2px solid #eee;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            background: none;
            border: none;
            font-weight: bold;
            color: #888;
            cursor: pointer;
            font-size: 15px;
        }

        .tab-btn.active {
            color: #1b4998;
            border-bottom: 3px solid #1b4998;
        }

        .form-group {
            margin-bottom: 14px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 13px;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
        }

        .form-group input:focus {
            border-color: #1b4998;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background-color: #1b4998;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }

        .btn:hover {
            background-color: #143673;
        }

        /* --- GIAO DIỆN CHÍNH (DASHBOARD) --- */
        .dashboard-container {
            width: 100%;
            max-width: 900px;
            padding: 0 15px;
        }

        header {
            background: #1b4998;
            color: white;
            padding: 16px 20px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .btn-logout {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }

        /* Thẻ thông tin tài khoản & Số dư */
        .balance-card {
            background: linear-gradient(135deg, #1b4998, #3b71ca);
            color: white;
            padding: 24px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .acc-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.2);
            padding-bottom: 10px;
        }

        .stk-badge {
            background: rgba(255,255,255,0.2);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .balance-card h3 {
            font-size: 13px;
            opacity: 0.8;
            margin-bottom: 5px;
        }

        .balance-card .amount {
            font-size: 28px;
            font-weight: bold;
        }

        /* Layout 2 Cột */
        .grid-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .grid-layout {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }

        .card h3 {
            margin-bottom: 16px;
            color: #1b4998;
            font-size: 17px;
            border-bottom: 2px solid #f0f2f5;
            padding-bottom: 8px;
        }

        /* Danh sách lịch sử */
        .history-list {
            list-style: none;
            max-height: 380px;
            overflow-y: auto;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }

        .history-item:last-child {
            border-bottom: none;
        }

        .history-item .info .title {
            font-weight: 600;
            font-size: 13px;
        }

        .history-item .info .time {
            font-size: 11px;
            color: #888;
        }

        .history-item .amount-minus {
            color: #e74c3c;
            font-weight: bold;
            font-size: 14px;
        }

        .history-item .amount-plus {
            color: #2ecc71;
            font-weight: bold;
            font-size: 14px;
        }

        /* POPUP MÃ PIN */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-card {
            background: white;
            padding: 24px;
            border-radius: 12px;
            width: 90%;
            max-width: 350px;
            text-align: center;
        }

        .modal-card h3 {
            margin-bottom: 10px;
            color: #1b4998;
        }

        .modal-card p {
            font-size: 13px;
            color: #666;
            margin-bottom: 15px;
        }

        .pin-input {
            width: 100%;
            letter-spacing: 8px;
            text-align: center;
            font-size: 22px;
            padding: 8px;
            margin-bottom: 15px;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
        }

        .btn-cancel {
            background: #ccc;
            color: #333;
        }

        .btn-cancel:hover {
            background: #bbb;
        }
    </style>
</head>
<body>

    <!-- 1. MÀN HÌNH ĐĂNG NHẬP / ĐĂNG KÝ -->
    <div id="auth-screen" class="auth-card">
        <h2>Demo Banking</h2>
        <p>Ngân hàng số an toàn & tiện lợi</p>
        
        <div class="auth-tabs">
            <button class="tab-btn active" id="tab-login-btn">Đăng Nhập</button>
            <button class="tab-btn" id="tab-register-btn">Đăng Ký</button>
        </div>

        <!-- FORM ĐĂNG NHẬP -->
        <form id="login-form">
            <div class="form-group">
                <label>Tên đăng nhập</label>
                <input type="text" id="login-user" placeholder="Nhập tên đăng nhập" required>
            </div>
            <div class="form-group">
                <label>Mật khẩu</label>
                <input type="password" id="login-pass" placeholder="Nhập mật khẩu" required>
            </div>
            <button type="submit" class="btn">Đăng Nhập</button>
        </form>

        <!-- FORM ĐĂNG KÝ TÀI KHOẢN MỚI -->
        <form id="register-form" class="hidden">
            <div class="form-group">
                <label>Họ và tên chủ tài khoản</label>
                <input type="text" id="reg-fullname" placeholder="VD: NGUYEN VAN A" required>
            </div>
            <div class="form-group">
                <label>Tên đăng nhập</label>
                <input type="text" id="reg-user" placeholder="Tên đăng nhập mới" required>
            </div>
            <div class="form-group">
                <label>Mật khẩu</label>
                <input type="password" id="reg-pass" placeholder="Mật khẩu đăng nhập" required>
            </div>
            <div class="form-group">
                <label>Thiết lập Mã PIN (6 chữ số)</label>
                <input type="password" id="reg-pin" maxlength="6" pattern="\d{6}" placeholder="VD: 123456" required>
            </div>
            <button type="submit" class="btn" style="background-color: #2ecc71;">Tạo Tài Khoản</button>
        </form>
    </div>

    <!-- 2. GIAO DIỆN CHÍNH SAU KHI ĐĂNG NHẬP -->
    <div id="app-screen" class="dashboard-container hidden">
        <header>
            <div>
                <h2 style="font-size: 18px;">Ngân hàng Số</h2>
                <small id="user-greeting">Xin chào, --</small>
            </div>
            <button id="logout-btn" class="btn-logout">Đăng xuất</button>
        </header>

        <!-- Thẻ Số Dư & Số Tài Khoản -->
        <div class="balance-card">
            <div class="acc-header">
                <span id="display-fullname" style="font-weight: 600;">--</span>
                <span class="stk-badge">STK: <span id="display-stk">--------</span></span>
            </div>
            <h3>SỐ DƯ KHẢ DỤNG</h3>
            <div class="amount" id="balance-display">0 VND</div>
        </div>

        <div class="grid-layout">
            <!-- Cột trái: Chuyển tiền & Đổi mã PIN -->
            <div>
                <!-- Form chuyển tiền -->
                <div class="card">
                    <h3>Chuyển tiền nội bộ</h3>
                    <form id="transfer-form">
                        <div class="form-group">
                            <label>Số tài khoản nhận (8 số)</label>
                            <input type="number" id="receiver-acc" placeholder="Nhập STK người nhận" required>
                        </div>
                        <div class="form-group">
                            <label>Số tiền (VND)</label>
                            <input type="number" id="transfer-amount" min="1000" placeholder="VD: 500000" required>
                        </div>
                        <div class="form-group">
                            <label>Nội dung chuyển khoản</label>
                            <input type="text" id="transfer-note" placeholder="Chuyen tien" required>
                        </div>
                        <button type="submit" class="btn">Chuyển Tiền</button>
                    </form>
                </div>

                <!-- Form đổi mã PIN -->
                <div class="card">
                    <h3>Đổi mã PIN giao dịch</h3>
                    <form id="change-pin-form">
                        <div class="form-group">
                            <label>Mã PIN hiện tại</label>
                            <input type="password" id="old-pin" maxlength="6" pattern="\d{6}" placeholder="******" required>
                        </div>
                        <div class="form-group">
                            <label>Mã PIN mới (6 số)</label>
                            <input type="password" id="new-pin" maxlength="6" pattern="\d{6}" placeholder="******" required>
                        </div>
                        <div class="form-group">
                            <label>Xác nhận mã PIN mới</label>
                            <input type="password" id="confirm-new-pin" maxlength="6" pattern="\d{6}" placeholder="******" required>
                        </div>
                        <button type="submit" class="btn" style="background-color: #f39c12;">Cập Nhật Mã PIN</button>
                    </form>
                </div>
            </div>

            <!-- Cột phải: Lịch sử giao dịch -->
            <div>
                <div class="card">
                    <h3>Lịch sử giao dịch</h3>
                    <ul class="history-list" id="history-list">
                        <!-- Danh sách giao dịch sẽ tự động chèn vào đây -->
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <!-- 3. POPUP (MODAL) XÁC NHẬN MÃ PIN -->
    <div id="pin-modal" class="modal-overlay hidden">
        <div class="modal-card">
            <h3>Xác thực giao dịch</h3>
            <p>Nhập mã PIN 6 số để hoàn tất chuyển khoản</p>
            <input type="password" id="pin-code" class="pin-input" maxlength="6" pattern="\d{6}" placeholder="******">
            <div class="modal-actions">
                <button id="cancel-pin-btn" class="btn btn-cancel">Hủy</button>
                <button id="confirm-pin-btn" class="btn">Xác nhận</button>
            </div>
        </div>
    </div>

    <!-- 4. XỬ LÝ JAVASCRIPT -->
    <script>
        // --- HÀM TẠO TÀI KHOẢN MẶC ĐỊNH LẦN ĐẦU MỞ WEB ---
        function initData() {
            if (!localStorage.getItem('bank_users')) {
                const defaultUsers = {
                    "admin": {
                        username: "admin",
                        password: "123",
                        fullname: "NGUYEN VAN ADMIN",
                        stk: "88888888",
                        balance: 50000000,
                        pin: "123456",
                        history: [
                            { title: "Nhan tien tu NGUYEN VAN B", time: "18/09/2026 - 09:00", amount: 5000000, type: "plus" }
                        ]
                    }
                };
                localStorage.setItem('bank_users', JSON.stringify(defaultUsers));
            }
        }
        initData();

        // Lấy cơ sở dữ liệu từ localStorage
        function getUsers() {
            return JSON.parse(localStorage.getItem('bank_users'));
        }

        function saveUsers(users) {
            localStorage.setItem('bank_users', JSON.stringify(users));
        }

        // Tạo STK 8 số ngẫu nhiên
        function generateRandomSTK() {
            return Math.floor(10000000 + Math.random() * 90000000).toString();
        }

        // Định dạng tiền tệ VND
        function formatMoney(amount) {
            return amount.toLocaleString('vi-VN') + ' VND';
        }

        // Biến lưu trạng thái hiện tại
        let currentUser = null;
        let pendingTransfer = null;

        // Elements DOM
        const authScreen = document.getElementById('auth-screen');
        const appScreen = document.getElementById('app-screen');
        const tabLoginBtn = document.getElementById('tab-login-btn');
        const tabRegisterBtn = document.getElementById('tab-register-btn');
        const loginForm = document.getElementById('login-form');
        const registerForm = document.getElementById('register-form');
        const pinModal = document.getElementById('pin-modal');

        // --- TABS CHUYỂN ĐỔI ĐĂNG NHẬP / ĐĂNG KÝ ---
        tabLoginBtn.addEventListener('click', () => {
            tabLoginBtn.classList.add('active');
            tabRegisterBtn.classList.remove('active');
            loginForm.classList.remove('hidden');
            registerForm.classList.add('hidden');
        });

        tabRegisterBtn.addEventListener('click', () => {
            tabRegisterBtn.classList.add('active');
            tabLoginBtn.classList.remove('active');
            registerForm.classList.remove('hidden');
            loginForm.classList.add('hidden');
        });

        // --- 1. XỬ LÝ ĐĂNG KÝ TÀI KHOẢN MỚI ---
        registerForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const fullname = document.getElementById('reg-fullname').value.trim().toUpperCase();
            const username = document.getElementById('reg-user').value.trim();
            const password = document.getElementById('reg-pass').value;
            const pin = document.getElementById('reg-pin').value;

            const users = getUsers();

            if (users[username]) {
                alert('Tên đăng nhập này đã tồn tại! Vui lòng chọn tên khác.');
                return;
            }

            if (pin.length !== 6 || isNaN(pin)) {
                alert('Mã PIN phải là 6 chữ số!');
                return;
            }

            // Tạo STK 8 số ngẫu nhiên không trùng lặp
            let newSTK = generateRandomSTK();

            // Lưu thông tin người dùng mới
            users[username] = {
                username: username,
                password: password,
                fullname: fullname,
                stk: newSTK,
                balance: 10000000, // Tặng sẵn 10 triệu trải nghiệm
                pin: pin,
                history: [
                    { title: "Thuong mo tai khoan moi", time: new Date().toLocaleString('vi-VN'), amount: 10000000, type: "plus" }
                ]
            };

            saveUsers(users);

            alert(`Đăng ký thành công!\n- Số Tài Khoản của bạn là: ${newSTK}\n- Tặng sẵn: 10,000,000 VND vào tài khoản.`);
            registerForm.reset();
            tabLoginBtn.click(); // Chuyển về màn hình Đăng nhập
        });

        // --- 2. XỬ LÝ ĐĂNG NHẬP ---
        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const username = document.getElementById('login-user').value.trim();
            const password = document.getElementById('login-pass').value;

            const users = getUsers();
            const user = users[username];

            if (user && user.password === password) {
                currentUser = user;
                updateDashboardUI();
                authScreen.classList.add('hidden');
                appScreen.classList.remove('hidden');
            } else {
                alert('Tên đăng nhập hoặc mật khẩu không chính xác!');
            }
        });

        // --- 3. ĐĂNG XUẤT ---
        document.getElementById('logout-btn').addEventListener('click', () => {
            currentUser = null;
            appScreen.classList.add('hidden');
            authScreen.classList.remove('hidden');
            loginForm.reset();
        });

        // --- 4. CẬP NHẬT GIAO DIỆN DASHBOARD ---
        function updateDashboardUI() {
            document.getElementById('user-greeting').textContent = `Xin chào, ${currentUser.fullname}`;
            document.getElementById('display-fullname').textContent = currentUser.fullname;
            document.getElementById('display-stk').textContent = currentUser.stk;
            document.getElementById('balance-display').textContent = formatMoney(currentUser.balance);

            // Render danh sách Lịch sử giao dịch
            const historyList = document.getElementById('history-list');
            historyList.innerHTML = '';

            if (currentUser.history.length === 0) {
                historyList.innerHTML = '<li style="text-align:center; color:#888; padding:15px;">Chưa có giao dịch nào</li>';
                return;
            }

            // Hiển thị giao dịch mới nhất lên đầu
            currentUser.history.slice().reverse().forEach(item => {
                const li = document.createElement('li');
                li.className = 'history-item';
                const isPlus = item.type === 'plus';
                li.innerHTML = `
                    <div class="info">
                        <div class="title">${item.title}</div>
