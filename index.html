<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo Internet Banking - Secure Edition</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        body {
            background-color: #f0f2f5;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px 0;
        }

        .hidden {
            display: none !important;
        }

        /* --- MÀN HÌNH XÁC THỰC (ĐĂNG NHẬP / ĐĂNG KÝ) --- */
        .auth-card {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .auth-card h2 {
            color: #1b4998;
            margin-bottom: 8px;
        }

        .auth-card p {
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .auth-tabs {
            display: flex;
            margin-bottom: 20px;
            border-bottom: 2px solid #eee;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            background: none;
            border: none;
            font-weight: bold;
            color: #888;
            cursor: pointer;
            font-size: 15px;
        }

        .tab-btn.active {
            color: #1b4998;
            border-bottom: 3px solid #1b4998;
        }

        .form-group {
            margin-bottom: 14px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 13px;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
        }

        .form-group input:focus {
            border-color: #1b4998;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background-color: #1b4998;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }

        .btn:hover {
            background-color: #143673;
        }

        /* --- GIAO DIỆN CHÍNH (DASHBOARD) --- */
        .dashboard-container {
            width: 100%;
            max-width: 900px;
            padding: 0 15px;
        }

        header {
            background: #1b4998;
            color: white;
            padding: 16px 20px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .btn-logout {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }

        /* Thẻ thông tin tài khoản & Số dư */
        .balance-card {
            background: linear-gradient(135deg, #1b4998, #3b71ca);
            color: white;
            padding: 24px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .acc-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.2);
            padding-bottom: 10px;
        }

        .stk-badge {
            background: rgba(255,255,255,0.2);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .balance-card h3 {
            font-size: 13px;
            opacity: 0.8;
            margin-bottom: 5px;
        }

        .balance-card .amount {
            font-size: 28px;
            font-weight: bold;
        }

        /* Layout 2 Cột */
        .grid-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .grid-layout {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }

        .card h3 {
            margin-bottom: 16px;
            color: #1b4998;
            font-size: 17px;
            border-bottom: 2px solid #f0f2f5;
            padding-bottom: 8px;
        }

        /* Danh sách lịch sử */
        .history-list {
            list-style: none;
            max-height: 380px;
            overflow-y: auto;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }

        .history-item:last-child {
            border-bottom: none;
        }

        .history-item .info .title {
            font-weight: 600;
            font-size: 13px;
        }

        .history-item .info .time {
            font-size: 11px;
            color: #888;
        }

        .history-item .amount-minus {
            color: #e74c3c;
            font-weight: bold;
            font-size: 14px;
        }

        .history-item .amount-plus {
            color: #2ecc71;
            font-weight: bold;
            font-size: 14px;
        }

        /* POPUP MÃ PIN */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-card {
            background: white;
            padding: 24px;
            border-radius: 12px;
            width: 90%;
            max-width: 350px;
            text-align: center;
        }

        .modal-card h3 {
            margin-bottom: 10px;
            color: #1b4998;
        }

        .modal-card p {
            font-size: 13px;
            color: #666;
            margin-bottom: 15px;
        }

        .pin-input {
            width: 100%;
            letter-spacing: 8px;
            text-align: center;
            font-size: 22px;
            padding: 8px;
            margin-bottom: 15px;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
        }

        .btn-cancel {
            background: #ccc;
            color: #333;
        }

        .btn-cancel:hover {
            background: #bbb;
        }
    </style>

    <!-- Thư viện Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>

    <!-- 1. MÀN HÌNH ĐĂNG NHẬP / ĐĂNG KÝ -->
    <div id="auth-screen" class="auth-card">
        <h2>Demo Banking</h2>
        <p>Ngân hàng số an toàn (Protected Edition)</p>
        
        <div class="auth-tabs">
            <button class="tab-btn active" id="tab-login-btn">Đăng Nhập</button>
            <button class="tab-btn" id="tab-register-btn">Đăng Ký</button>
        </div>

        <!-- FORM ĐĂNG NHẬP -->
        <form id="login-form" autocomplete="off">
            <div class="form-group">
                <label>Tên đăng nhập</label>
                <input type="text" id="login-user" placeholder="Nhập tên đăng nhập" required maxlength="30">
            </div>
            <div class="form-group">
                <label>Mật khẩu</label>
                <input type="password" id="login-pass" placeholder="Nhập mật khẩu" required maxlength="50">
            </div>
            <button type="submit" class="btn">Đăng Nhập</button>
        </form>

        <!-- FORM ĐĂNG KÝ -->
        <form id="register-form" class="hidden" autocomplete="off">
            <div class="form-group">
                <label>Họ và tên chủ tài khoản</label>
                <input type="text" id="reg-fullname" placeholder="VD: NGUYEN VAN A" required maxlength="50">
            </div>
            <div class="form-group">
                <label>Tên đăng nhập</label>
                <input type="text" id="reg-user" placeholder="Tên đăng nhập mới" required maxlength="30">
            </div>
            <div class="form-group">
                <label>Mật khẩu</label>
                <input type="password" id="reg-pass" placeholder="Mật khẩu (ít nhất 6 ký tự)" required minlength="6" maxlength="50">
            </div>
            <div class="form-group">
                <label>Thiết lập Mã PIN (6 chữ số)</label>
                <input type="password" id="reg-pin" maxlength="6" pattern="\d{6}" placeholder="VD: 123456" required>
            </div>
            <button type="submit" class="btn" style="background-color: #2ecc71;">Tạo Tài Khoản</button>
        </form>
    </div>

    <!-- 2. GIAO DIỆN CHÍNH -->
    <div id="app-screen" class="dashboard-container hidden">
        <header>
            <div>
                <h2 style="font-size: 18px;">Ngân hàng Số</h2>
                <small id="user-greeting">Xin chào, --</small>
            </div>
            <button id="logout-btn" class="btn-logout">Đăng xuất</button>
        </header>

        <!-- Thẻ Số Dư -->
        <div class="balance-card">
            <div class="acc-header">
                <span id="display-fullname" style="font-weight: 600;">--</span>
                <span class="stk-badge">STK: <span id="display-stk">--------</span></span>
            </div>
            <h3>SỐ DƯ KHẢ DỤNG</h3>
            <div class="amount" id="balance-display">0 VND</div>
        </div>

        <div class="grid-layout">
            <!-- Cột trái -->
            <div>
                <!-- Form chuyển tiền -->
                <div class="card">
                    <h3>Chuyển tiền nội bộ</h3>
                    <form id="transfer-form" autocomplete="off">
                        <div class="form-group">
                            <label>Số tài khoản nhận (8 số)</label>
                            <input type="number" id="receiver-acc" placeholder="Nhập STK người nhận" required pattern="\d{8}">
                        </div>
                        <div class="form-group">
                            <label>Số tiền (VND)</label>
                            <input type="number" id="transfer-amount" min="1000" max="500000000" step="1000" placeholder="VD: 500000" required>
                        </div>
                        <div class="form-group">
                            <label>Nội dung chuyển khoản</label>
                            <input type="text" id="transfer-note" placeholder="Chuyen tien" required maxlength="100">
                        </div>
                        <button type="submit" class="btn">Chuyển Tiền</button>
                    </form>
                </div>

                <!-- Form đổi mã PIN -->
                <div class="card">
                    <h3>Đổi mã PIN giao dịch</h3>
                    <form id="change-pin-form" autocomplete="off">
                        <div class="form-group">
                            <label>Mã PIN hiện tại</label>
                            <input type="password" id="old-pin" maxlength="6" pattern="\d{6}" placeholder="******" required>
                        </div>
                        <div class="form-group">
                            <label>Mã PIN mới (6 số)</label>
                            <input type="password" id="new-pin" maxlength="6" pattern="\d{6}" placeholder="******" required>
                        </div>
                        <div class="form-group">
                            <label>Xác nhận mã PIN mới</label>
                            <input type="password" id="confirm-new-pin" maxlength="6" pattern="\d{6}" placeholder="******" required>
                        </div>
                        <button type="submit" class="btn" style="background-color: #f39c12;">Cập Nhật Mã PIN</button>
                    </form>
                </div>
            </div>

            <!-- Cột phải -->
            <div>
                <div class="card">
                    <h3>Lịch sử giao dịch</h3>
                    <ul class="history-list" id="history-list"></ul>
                </div>
            </div>
        </div>
    </div>

    <!-- 3. POPUP MÃ PIN -->
    <div id="pin-modal" class="modal-overlay hidden">
        <div class="modal-card">
            <h3>Xác thực giao dịch</h3>
            <p>Nhập mã PIN 6 số để hoàn tất</p>
            <input type="password" id="pin-code" class="pin-input" maxlength="6" pattern="\d{6}" placeholder="******">
            <div class="modal-actions">
                <button id="cancel-pin-btn" class="btn btn-cancel">Hủy</button>
                <button id="confirm-pin-btn" class="btn">Xác nhận</button>
            </div>
        </div>
    </div>

    <!-- 4. XỬ LÝ BẢO MẬT & JAVASCRIPT -->
    <script>
        // =========================================================================
        // CONFIG FIREBASE (DÁN API CỦA BẠN VÀO ĐÂY)
        // =========================================================================
        const firebaseConfig = {
            apiKey: "DÁN_API_KEY_CỦA_BẠN_VÀO_ĐÂY",
            authDomain: "TÊN_PROJECT_CỦA_BẠN.firebaseapp.com",
            projectId: "ID_PROJECT_CỦA_BẠN",
            storageBucket: "TÊN_PROJECT_CỦA_BẠN.appspot.com",
            messagingSenderId: "SỐ_MESSAGING_SENDER_ID",
            appId: "MÃ_APP_ID"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // =========================================================================
        // HÀM BẢO MẬT HỖ TRỢ (SECURITY UTILITIES)
        // =========================================================================
        
        // 1. Chống XSS (Mã hóa đầu vào trước khi in ra HTML)
        function escapeHTML(str) {
            if (typeof str !== 'string') return str;
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        // 2. Kiểm tra định dạng Username an toàn (Chỉ cho phép chữ, số và dấu gạch dưới)
        function isValidUsername(username) {
            return /^[a-zA-Z0-9_]{3,30}$/.test(username);
        }

        // 3. Quản lý thời gian chờ tự động đăng xuất (Inactivity Timeout - 5 phút)
        let inactivityTimer = null;
        const INACTIVITY_LIMIT = 5 * 60 * 1000; // 5 phút

        function resetInactivityTimer() {
            clearTimeout(inactivityTimer);
            if (currentUser) {
                inactivityTimer = setTimeout(() => {
                    alert('Phiên làm việc hết hạn do bạn không thao tác trong 5 phút!');
                    document.getElementById('logout-btn').click();
                }, INACTIVITY_LIMIT);
            }
        }

        // Bắt các sự kiện thao tác người dùng
        ['click', 'mousemove', 'keypress', 'scroll', 'touchstart'].forEach(evt => {
            document.addEventListener(evt, resetInactivityTimer, true);
        });

        // 4. Khóa chống dò mã PIN (Brute-force protection)
        let failedPinCount = 0;
        const MAX_FAILED_PIN = 3;

        // =========================================================================
        // KHỞI TẠO BIẾN & ĐIỀU HƯỚNG GIAO DIỆN
        // =========================================================================
        let currentUser = null;
        let pendingTransfer = null;
        let unsubscribeListener = null;

        const authScreen = document.getElementById('auth-screen');
        const appScreen = document.getElementById('app-screen');
        const tabLoginBtn = document.getElementById('tab-login-btn');
        const tabRegisterBtn = document.getElementById('tab-register-btn');
        const loginForm = document.getElementById('login-form');
        const registerForm = document.getElementById('register-form');
        const pinModal = document.getElementById('pin-modal');

        function generateRandomSTK() {
            return Math.floor(10000000 + Math.random() * 90000000).toString();
        }

        function formatMoney(amount) {
            return Number(amount).toLocaleString('vi-VN') + ' VND';
        }

        tabLoginBtn.addEventListener('click', () => {
            tabLoginBtn.classList.add('active');
            tabRegisterBtn.classList.remove('active');
            loginForm.classList.remove('hidden');
            registerForm.classList.add('hidden');
        });

        tabRegisterBtn.addEventListener('click', () => {
            tabRegisterBtn.classList.add('active');
            tabLoginBtn.classList.remove('active');
            registerForm.classList.remove('hidden');
            loginForm.classList.add('hidden');
        });

        // --- 1. ĐĂNG KÝ TÀI KHOẢN ---
        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const fullname = document.getElementById('reg-fullname').value.trim().toUpperCase();
            const username = document.getElementById('reg-user').value.trim().toLowerCase();
            const password = document.getElementById('reg-pass').value;
            const pin = document.getElementById('reg-pin').value;

            if (!isValidUsername(username)) {
                alert('Tên đăng nhập không hợp lệ! (Chỉ dùng từ 3-30 ký tự, không dấu, không khoảng trắng)');
                return;
            }

            if (pin.length !== 6 || isNaN(pin)) {
                alert('Mã PIN phải gồm đúng 6 chữ số!');
                return;
            }

            try {
                const userDoc = await db.collection('users').doc(username).get();
                if (userDoc.exists) {
                    alert('Tên đăng nhập này đã tồn tại!');
                    return;
                }

                const newSTK = generateRandomSTK();
                const nowStr = new Date().toLocaleString('vi-VN');

                await db.collection('users').doc(username).set({
                    username: username,
                    password: password,
                    fullname: fullname,
                    stk: newSTK,
                    balance: 10000000,
                    pin: pin,
                    history: [
                        { title: "Thuong mo tai khoan moi", time: nowStr, amount: 10000000, type: "plus" }
                    ]
                });

                alert(`Đăng ký thành công!\n- Số Tài Khoản: ${newSTK}\n- Số dư ban đầu: 10,000,000 VND.`);
                registerForm.reset();
                tabLoginBtn.click();

            } catch (error) {
                alert('Lỗi đăng ký: ' + error.message);
            }
        });

        // --- 2. ĐĂNG NHẬP ---
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('login-user').value.trim().toLowerCase();
            const password = document.getElementById('login-pass').value;

            try {
                const userDoc = await db.collection('users').doc(username).get();
